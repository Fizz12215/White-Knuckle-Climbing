plugins {
	// Minecraft 26.x ships unobfuscated (Mojang's names), so Loom doesn't remap and there are no mappings
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"wkclimb" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wkclimb-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// WKCLIMB_TEST_GRAPHICS=opengl or vulkan picks the in-game tests' graphics engine. The test framework
// rewrites options.txt at startup, so it goes in as a launch argument.
def testGraphics = System.getenv("WKCLIMB_TEST_GRAPHICS")
if (testGraphics) {
	loom.runs.named("clientGameTest") { programArgs("--graphicsBackend", testGraphics) }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// The asset extractor rides along in the jar, so the in-game Build button can run it (AssetBuilder).
processClientResources {
	from("tools") {
		include "extract_wk_assets.py", "requirements.txt"
		into "wkclimb/extractor"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Copy the built jar into a local Minecraft instance (path from local.properties: modsDir=...).
def localProps = new Properties()
def localFile = file("local.properties")
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def modsDir = localProps.getProperty("modsDir")

// The Minecraft version of the Prism instance that owns modsDir (its mmc-pack.json), or null if unknown.
// A jar for another Minecraft version would stop that instance from starting, so it isn't copied there.
def instanceMinecraft = {
	def pack = modsDir == null ? null : file("${modsDir}/../../mmc-pack.json")
	if (pack == null || !pack.isFile()) return null
	return new groovy.json.JsonSlurper().parse(pack).components?.find { it.uid == "net.minecraft" }?.version
}
def instanceMatches = { -> instanceMinecraft() in [null, project.minecraft_version] }

tasks.register("installMod", Copy) {
	onlyIf { modsDir != null && file(modsDir).isDirectory() && instanceMatches() }
	dependsOn tasks.named("jar")
	from tasks.named("jar")
	into modsDir ?: "build/no-mods-dir"
	// remove older versions of this mod so only one copy is ever in the mods folder
	doFirst {
		fileTree(modsDir).matching { include "${base.archivesName.get()}-*.jar" }.each { it.delete() }
	}
	doLast { println "Installed ${base.archivesName.get()}-${version}.jar into ${modsDir}" }
}
tasks.named("build") { finalizedBy "installMod" }
// Say so when local.properties points at a mods folder that no longer exists (e.g. a renamed instance)
gradle.taskGraph.whenReady { graph ->
	if (graph.hasTask(":installMod") && modsDir != null && !file(modsDir).isDirectory()) {
		logger.warn("WARNING: modsDir in local.properties doesn't exist, so the jar was NOT installed: ${modsDir}")
	}
	if (graph.hasTask(":installMod") && modsDir != null && file(modsDir).isDirectory() && !instanceMatches()) {
		logger.warn("WARNING: the instance at modsDir is Minecraft ${instanceMinecraft()}, this build is " +
				"${project.minecraft_version}, so the jar was NOT installed: ${modsDir}")
	}
}

// Beta package for testers: the mod jar, the asset extractor (+ one-click scripts) and a guide.
// No White Knuckle files are included: each tester builds the pack from their own copy of the game.
tasks.register("betaZip", Zip) {
	dependsOn tasks.named("jar")
	archiveFileName = "White-Knuckle-Climbing-${version}.zip"
	destinationDirectory = layout.buildDirectory.dir("beta")
	into("White-Knuckle-Climbing-${version}") {
		from("beta/README.txt")
		from("LICENSE")
		from("CHANGELOG.md")
		into("mods") { from tasks.named("jar") }
		into("asset-extractor") {
			from("tools/extract_wk_assets.py")
			from("tools/requirements.txt")
			from("beta/Get White Knuckle Assets (Windows).bat")
			from("beta/get-white-knuckle-assets.sh") { filePermissions { unix("rwxr-xr-x") } }
		}
	}
}

jar {
	from("LICENSE") { rename { "LICENSE_wkclimb" } }
}
